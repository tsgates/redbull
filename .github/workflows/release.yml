name: Release

# Build the size-optimized Redbull.app packages as a CI check and keep them as
# workflow artifacts. Releases are NOT published from here: CI has no Developer
# ID certificate, so its builds are only ad-hoc signed. Publish releases from a
# machine with the certificate and a notarytool profile (see release.sh):
#     ./release.sh && gh release create vX.Y.Z dist/* --generate-notes
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Run JavaScript actions on Node.js 24 (Node 20 is deprecated on runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly toolchain + rust-src
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release artifacts
        run: bash ./release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redbull-arm64
          path: dist/*
